name: skillbridge_python_lab
description: "SkillBridge Python Lab - an offline-first mobile Python coding practice app for SKILLBRIDGE Digital Talent & Outsourcing Academy."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management / dependency injection.
  provider: ^6.1.2

  # Local storage (offline-first drafts, submissions, exercise cache).
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  # Web build has no dart:ffi, so SQLite runs as wasm in a shared worker.
  # See lib/core/storage/database_factory_web.dart.
  sqflite_common_ffi_web: ^1.2.0
  path: ^1.9.0
  path_provider: ^2.1.5

  # Networking for the LMS integration layer.
  http: ^1.2.2
  connectivity_plus: ^6.1.0

  # Lightweight preferences (theme, editor settings).
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  crypto: ^3.0.6

  # Embedded CPython runtime for on-device execution (Android/iOS/desktop).
  # See docs/ADR_001_PYTHON_RUNTIME.md for the evaluation and rationale.
  serious_python: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/editor/
    - python_app/
